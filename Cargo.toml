[package]
name = "rdns"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
hickory-proto = { version = "0.26", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "logging", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs", "logging", "tls12"] }
rustls-pki-types = "1.8"
webpki-roots = "0.26"
regex = "1.10"
ipnet = { version = "2.10", features = ["serde"] }
parking_lot = "0.12"
axum = "0.8"
futures = "0.3"
rand = "0.8"
flate2 = "1.0"
base64 = "0.22"
rustls-pemfile = "2.2.0"
axum-server = { version = "0.8.0", features = ["tls-rustls"] }

[dev-dependencies]
rcgen = "0.14.10"
tempfile = "3.12"
tower = { version = "0.5", features = ["util"] }
